<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pak-Qatar Takaful - Smart Profit Calculator</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8B1538">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .app-container {
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 35px 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo { text-align: center; margin-bottom: 15px; }
        .logo img { max-width: 130px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1)); }
        
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { 
            color: #8B1538; 
            font-size: 26px; 
            font-weight: 700;
            margin-bottom: 5px;
        }
        .header p { color: #666; font-size: 13px; font-weight: 400; }
        
        .input-group { margin-bottom: 22px; }
        .input-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-wrapper span {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #8B1538;
            font-weight: 600;
        }
        
        input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid #e8e8e8;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            transition: all 0.3s;
            background: #f8f9fa;
        }
        
        input:focus {
            outline: none;
            border-color: #8B1538;
            background: white;
            box-shadow: 0 0 0 4px rgba(139, 21, 56, 0.1);
        }
        
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #8B1538 0%, #C41E3A 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(139, 21, 56, 0.4);
            margin-top: 10px;
        }
        
        button:active { transform: scale(0.98); }
        
        #result { margin-top: 30px; display: none; }
        #result.show { display: block; animation: fadeIn 0.4s ease; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result-header {
            background: linear-gradient(135deg, #8B1538 0%, #C41E3A 100%);
            color: white;
            padding: 20px;
            border-radius: 15px 15px 0 0;
            text-align: center;
        }
        
        .result-header h3 { font-size: 18px; margin-bottom: 5px; }
        .result-header p { font-size: 13px; opacity: 0.9; }
        
        .result-body {
            background: white;
            border-radius: 0 0 15px 15px;
            padding: 5px 20px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        
        .profit-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            margin-top: 12px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 4px solid #8B1538;
            transition: all 0.3s;
        }
        
        .profit-card:hover { background: #f0f0f0; transform: translateX(5px); }
        
        .profit-label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        
        .profit-icon {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #8B1538 0%, #C41E3A 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .profit-value {
            color: #8B1538;
            font-weight: 700;
            font-size: 16px;
        }
        
        .total-box {
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #8B1538 0%, #C41E3A 100%);
            border-radius: 15px;
            text-align: center;
            color: white;
        }
        
        .total-box .label { font-size: 13px; opacity: 0.9; margin-bottom: 8px; }
        .total-box .value { font-size: 28px; font-weight: 700; }
        
        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 11px;
            color: #999;
        }
        .creator {
    color: #8B1538 !important;
    font-size: 15px !important;
    font-weight: 700 !important;
    margin: 8px 0 !important;
    text-transform: uppercase;
    letter-spacing: 1px;
    animation: glow 2s ease-in-out infinite;
}

.creator span {
    background: linear-gradient(135deg, #8B1538 0%, #C41E3A 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-size: 17px;
    text-shadow: 0 0 20px rgba(139, 21, 56, 0.3);
}

@keyframes glow {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.8; }
}
    </style>
</head>
<body>
    <div class="app-container">
        <div class="logo">
            <img src="logo.PNG" alt="Pak-Qatar Takaful">
        </div>
        
        <div class="header">
    <h1>Smart Profit Calculator</h1>
    <p class="creator">Developed by <span>Zaid Nasir Khan</span></p>
    
</div>
        
        <div class="input-group">
            <label>💰 Investment Amount</label>
            <div class="input-wrapper">
                <span>PKR</span>
                <input type="number" id="amount" placeholder="100,000">
            </div>
        </div>
        
        <div class="input-group">
            <label>📈 Expected Profit Rate</label>
            <div class="input-wrapper">
                <span>%</span>
                <input type="number" id="rate" step="0.01" placeholder="9.51">
            </div>
        </div>
        
        <button onclick="calculate()">Calculate Profit Instantly ⚡</button>
        
        <div id="result"></div>
        
        <div class="footer">
            © Pak-Qatar Takaful Limited | Professional Calculator
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        function calculate() {
            let amount = parseFloat(document.getElementById('amount').value);
            let rate = parseFloat(document.getElementById('rate').value);
            
            if (!amount || !rate || amount <= 0 || rate <= 0) {
                alert('⚠️ Please enter valid Amount and Rate');
                return;
            }
            
            let yearly = (amount * rate) / 100;
            let monthly = yearly / 12;
            let weekly = yearly / 52;
            let daily = yearly / 365;
            let total = amount + yearly;
            
            document.getElementById('result').innerHTML = `
                <div class="result-header">
                    <h3>Profit Breakdown Ready ✨</h3>
                    <p>Investment: PKR ${amount.toLocaleString()} @ ${rate}%</p>
                </div>
                <div class="result-body">
                    <div class="profit-card">
                        <div class="profit-label">
                            <div class="profit-icon">📅</div>
                            <span>Daily Profit</span>
                        </div>
                        <div class="profit-value">PKR ${daily.toFixed(2)}</div>
                    </div>
                    <div class="profit-card">
                        <div class="profit-label">
                            <div class="profit-icon">📆</div>
                            <span>Weekly Profit</span>
                        </div>
                        <div class="profit-value">PKR ${weekly.toFixed(2)}</div>
                    </div>
                    <div class="profit-card">
                        <div class="profit-label">
                            <div class="profit-icon">🗓️</div>
                            <span>Monthly Profit</span>
                        </div>
                        <div class="profit-value">PKR ${monthly.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                    </div>
                    <div class="profit-card">
                        <div class="profit-label">
                            <div class="profit-icon">📊</div>
                            <span>Yearly Profit</span>
                        </div>
                        <div class="profit-value">PKR ${yearly.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                    </div>
                    <div class="total-box">
                        <div class="label">Total Maturity Value (After 1 Year)</div>
                        <div class="value">PKR ${total.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                    </div>
                </div>
            `;
            document.getElementById('result').classList.add('show');
        }
    </script>
</body>
</html>
