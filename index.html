<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Pak-Qatar Calc">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#006838">
    <title>Pak-Qatar Takaful Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F5F5F5;
            padding: 16px;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            padding: 24px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #E5E5E5;
        }
        
        .logo img {
            max-width: 280px;
            width: 100%;
            height: auto;
        }
        
        h1 {
            text-align: center;
            color: #000000;
            font-size: 18px;
            font-weight: 600;
            margin: 16px 0 4px 0;
        }
        
        .subtitle {
            text-align: center;
            color: #8B1538;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 24px;
        }
        
        label {
            display: block;
            color: #1A1A1A;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #E0E0E0;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 18px;
        }
        
        input:focus {
            outline: none;
            border-color: #006838;
            box-shadow: 0 0 0 3px rgba(0,104,56,0.1);
        }
        
        button {
            width: 100%;
            background: linear-gradient(135deg, #006838 0%, #00512C 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(0,104,56,0.3);
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        .result {
            margin-top: 24px;
            padding: 20px;
            background: linear-gradient(135deg, #F0F9F4 0%, #E8F5E9 100%);
            border-left: 4px solid #8B1538;
            border-radius: 8px;
            display: none;
        }
        
        .result.show {
            display: block;
        }
        
        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            font-size: 15px;
        }
        
        .result-row:last-child {
            margin-bottom: 0;
            padding-top: 14px;
            border-top: 2px solid #8B1538;
            font-weight: 700;
            font-size: 18px;
            color: #006838;
        }
        
        .footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #E5E5E5;
            font-size: 11px;
            color: #8B1538;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="logo.PNG" alt="Pak-Qatar Takaful">
        </div>
        
        <h1>Profit Rate Calculator</h1>
        <p class="subtitle">Together for Better</p>
        
        <label>Investment Amount (PKR)</label>
        <input type="number" id="amount" placeholder="e.g. 100000">
        
        <label>Duration (Years)</label>
        <input type="number" id="years" placeholder="e.g. 5">
        
        <label>Expected Profit Rate (%)</label>
        <input type="number" id="rate" placeholder="e.g. 12" step="0.1">
        
        <button onclick="calculate()">Calculate Profit</button>
        
        <div class="result" id="result">
            <div class="result-row">
                <span>Principal Amount:</span>
                <span id="principal">-</span>
            </div>
            <div class="result-row">
                <span>Total Profit:</span>
                <span id="profit">-</span>
            </div>
            <div class="result-row">
                <span>Maturity Value:</span>
                <span id="total">-</span>
            </div>
        </div>
        
        <div class="footer">
            © Pak-Qatar Takaful Limited | Together for Better
        </div>
    </div>

    <script>
        function calculate() {
    let amount = parseFloat(document.getElementById('amount').value);
    let rate = parseFloat(document.getElementById('rate').value);
    
    if (!amount || !rate) {
        alert('Amount aur Rate dalo');
        return;
    }
    
    let yearly = (amount * rate) / 100;
    let monthly = yearly / 12;
    let weekly = yearly / 52;
    let daily = yearly / 365;
    
    document.getElementById('result').innerHTML = `
        <div style="background:#f0f8ff; padding:20px; border-radius:12px; margin-top:20px;">
            <h3 style="color:#8B1538; margin-top:0;">Profit Breakdown</h3>
            <p><b>Investment:</b> PKR ${amount.toLocaleString()}</p>
            <p><b>Rate:</b> ${rate}%</p>
            <hr>
            <p><b>Daily:</b> PKR ${daily.toFixed(2)}</p>
            <p><b>Weekly:</b> PKR ${weekly.toFixed(2)}</p>
            <p><b>Monthly:</b> PKR ${monthly.toFixed(2)}</p>
            <p><b>Yearly:</b> PKR ${yearly.toFixed(2)}</p>
        </div>
    `;
}
        
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
